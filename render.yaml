services:
  - type: web
    name: akena-portfolio-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: SERVE_FRONTEND
        value: "false"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: PUBLIC_ORIGIN
        sync: false
