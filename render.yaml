services:
  - type: web
    name: akena-portfolio
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: akena-contacts
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: PUBLIC_ORIGIN
        sync: false
databases:
  - name: akena-contacts
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
    databaseName: portfolio
    user: portfolio
